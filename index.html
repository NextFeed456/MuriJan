<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ふわふわ麻雀🌸</title>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }
    
    /* 💡 スマホの画面内に完全に収めるためのレイアウト設計 */
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #fff5f7;
      color: #5a4048;
      font-family: 'Hiragino Sans', 'ヒラギノ角ゴ ProN', 'Meiryo', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 4px;
      position: relative;
    }

    /* 背景画像用オーバーレイ */
    #bg-layer {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: -1;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
      pointer-events: none;
    }
    #bg-layer.active {
      opacity: 1;
    }

    /* 💀 HP0時のガチデス感スタイル */
    body.death-mode {
      background-color: #0d0000 !important;
      color: #ff3333 !important;
      animation: deathShake 0.5s ease-in-out;
    }
    @keyframes deathShake {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-10px, 10px); }
      40% { transform: translate(10px, -10px); }
      60% { transform: translate(-8px, -5px); }
      80% { transform: translate(8px, 5px); }
    }

    h1 {
      font-size: 16px;
      text-align: center;
      color: #ff7799;
      letter-spacing: 1px;
      text-shadow: 1px 1px 0px #ffe0e8;
      margin-bottom: 2px;
      flex-shrink: 0;
    }
    body.death-mode h1 {
      color: #ff0000 !important;
      text-shadow: 0 0 10px #ff0000 !important;
    }

    /* 折りたたみルールのスタイル */
    .rules-details {
      width: 100%;
      max-width: 680px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #ffccd5;
      border-radius: 8px;
      margin-bottom: 2px;
      flex-shrink: 0;
    }
    .rules-summary {
      padding: 2px 6px;
      font-size: 10px;
      font-weight: bold;
      color: #ff6688;
      cursor: pointer;
      user-select: none;
      background: #ffe6ec;
      display: flex;
      justify-content: space-between;
    }
    .rules-content {
      padding: 4px 8px;
      font-size: 10px;
      line-height: 1.3;
      color: #5a4048;
      max-height: 80px;
      overflow-y: auto;
    }

    /* 音量調整バー */
    .volume-container {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #ffccd5;
      border-radius: 10px;
      padding: 2px 8px;
      margin-bottom: 2px;
      font-size: 10px;
      font-weight: bold;
      color: #ff7799;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .volume-container input {
      accent-color: #ff7799;
      cursor: pointer;
      width: 70px;
    }

    .bgm-btn {
      background: #ff7799;
      color: white;
      border: none;
      padding: 1px 6px;
      border-radius: 8px;
      font-size: 9px;
      cursor: pointer;
    }
    .bgm-btn.active { background: #4db6ac; }

    /* HPゲージ */
    .hp-container {
      width: 100%;
      max-width: 680px;
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid #ffb6c1;
      border-radius: 10px;
      padding: 2px 8px;
      margin-bottom: 3px;
      flex-shrink: 0;
    }
    .hp-header {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      font-size: 10px;
      margin-bottom: 1px;
      color: #ff6688;
    }
    .hp-bar-outer {
      width: 100%;
      height: 10px;
      background: #ffe6eb;
      border-radius: 5px;
      overflow: hidden;
    }
    .hp-bar-inner {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #ff99bb, #ff5588);
      border-radius: 5px;
      transition: width 0.3s ease;
    }
    
    .game-layout {
      display: flex;
      gap: 8px;
      max-width: 980px;
      width: 100%;
      flex: 1;
      justify-content: center;
      min-height: 0;
      overflow: hidden;
    }

    /* 麻雀ボード本体 */
    .game-board {
      background-color: rgba(255, 240, 243, 0.95);
      border: 3px solid #ffb6c1;
      border-radius: 14px;
      flex: 1;
      width: 100%;
      max-width: 680px;
      padding: 6px 8px;
      box-shadow: 0 4px 10px rgba(255, 182, 193, 0.4);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }
    body.death-mode .game-board {
      background-color: rgba(43, 8, 8, 0.95);
      border-color: #5a0e0e;
    }

    /* ランキングボード */
    .ranking-board {
      background-color: rgba(255, 255, 255, 0.95);
      border: 2px solid #ffccd5;
      border-radius: 14px;
      width: 220px;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }
    .ranking-summary {
      font-size: 11px;
      font-weight: bold;
      color: #ff6688;
      text-align: center;
      padding: 6px;
      cursor: pointer;
      background: #ffe6ec;
      display: flex;
      justify-content: space-between;
    }
    .ranking-content {
      padding: 6px;
      overflow-y: auto;
      flex: 1;
    }
    .ranking-list { list-style: none; padding: 0; margin: 0; }
    .ranking-item {
      background: #fff5f7;
      margin-bottom: 3px;
      padding: 4px 6px;
      border-radius: 6px;
      font-size: 10px;
      border-left: 3px solid #ff88aa;
    }
    .ranking-item .rank-head { font-weight: bold; color: #ff5577; display: flex; justify-content: space-between; }
    .ranking-item .rank-player { color: #5a4048; font-size: 9px; }
    .ranking-item .rank-detail { font-size: 9px; color: #886670; }

    .info-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      padding: 3px 8px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: bold;
      color: #775560;
      flex-shrink: 0;
    }

    .dora-area { display: flex; align-items: center; gap: 2px; }

    .tenpai-info-bar {
      background: #ffe6ec;
      border: 1px solid #ffb6c1;
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 10px;
      color: #ff5577;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .status-badge {
      background-color: #ff6688;
      color: white;
      padding: 1px 4px;
      border-radius: 6px;
      font-size: 9px;
      display: none;
    }

    .river-section {
      background: #ffffff;
      border-radius: 8px;
      padding: 4px 6px;
      border: 1px dashed #ffccd5;
      flex: 1;
      min-height: 45px;
      max-height: 65px;
      overflow-y: auto;
    }
    .river-title { font-size: 9px; color: #ff7799; font-weight: bold; margin-bottom: 1px; }
    .tile-container { display: flex; flex-wrap: wrap; gap: 2px; }
    
    .hand-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      flex-shrink: 0;
    }
    .hand-tiles-area {
      display: flex;
      flex-wrap: nowrap;
      gap: 2px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    /* 💡 スマホの画面横幅に完璧に自動フィットする牌サイズ */
    .tile {
      width: calc((100vw - 45px) / 14);
      max-width: 30px;
      min-width: 18px;
      height: 38px;
      background: #ffffff;
      color: #443338;
      border-radius: 4px;
      border-bottom: 2px solid #e6ccd3;
      box-shadow: 0 1px 2px rgba(255, 182, 193, 0.4);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      user-select: none;
      font-weight: bold;
      position: relative;
      flex-shrink: 0;
    }
    .tile:active { transform: translateY(-2px); background-color: #fff0f3; }
    .tile.riichi-target { border: 2px solid #ff4477; animation: pulse 1s infinite; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 68, 119, 0.7); }
      70% { box-shadow: 0 0 0 5px rgba(255, 68, 119, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 68, 119, 0); }
    }

    .tile.destroying {
      animation: popDestroyAnim 0.7s cubic-bezier(0.25, 1, 0.5, 1) forwards !important;
      z-index: 50;
      pointer-events: none;
    }
    @keyframes popDestroyAnim {
      0% { transform: scale(1) translateY(0); filter: brightness(1); opacity: 1; }
      30% { transform: scale(1.2) translateY(-6px); filter: brightness(1.5); background-color: #ff3366; color: #fff; }
      100% { transform: scale(0.2) translateY(-40px) rotate(20deg); opacity: 0; }
    }

    .tile.slide-in { animation: slideInAnim 0.4s ease-out forwards; }
    @keyframes slideInAnim {
      0% { transform: translateY(-20px) scale(0.8); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    .tile.new-drawn { border: 2px solid #00bfa5 !important; }

    .tile.red { color: #e04466; }
    .tile.green { color: #27ae60; }
    .tile.black { color: #443338; }
    .tile.aka-dora { background-color: #ffe6ec; }
    .tile-num { font-size: 11px; line-height: 1; }
    .tile-type { font-size: 7px; margin-top: 1px; }

    .tile.small { width: 18px; height: 24px; border-bottom: 1px solid #e6ccd3; }
    .tile.small .tile-num { font-size: 9px; }
    .tile.small .tile-type { font-size: 6px; }

    .drawn-tile-area { border-left: 2px dashed #ffb6c1; padding-left: 4px; flex-shrink: 0; }

    /* 💡 ボタンをコンパクトにまとめて絶対に溢れないように調整 */
    .controls {
      display: flex;
      justify-content: center;
      gap: 3px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    button {
      background-color: #ff88aa;
      border: none;
      color: white;
      padding: 4px 8px;
      font-size: 10px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 2px 0 #e06688;
      touch-action: manipulation;
    }
    button:active { transform: translateY(1px); box-shadow: none; }
    button:disabled { background-color: #ddccdd; box-shadow: none; cursor: not-allowed; opacity: 0.5; }
    button.btn-riichi { background-color: #ff5577; }
    button.btn-kan { background-color: #ba68c8; }
    button.btn-sacrifice { background-color: #4db6ac; }
    button.btn-kyushu { background-color: #ff9800; }
    button.btn-cancel { background-color: #b0bec5; }

    button.btn-win-glow {
      background-color: #ff4081 !important;
      animation: winGlow 0.8s infinite alternate;
    }
    @keyframes winGlow {
      0% { transform: scale(1); box-shadow: 0 0 3px #ff4081; }
      100% { transform: scale(1.05); box-shadow: 0 0 8px #ffd54f; }
    }

    .result-box {
      background: #ffffff;
      border-radius: 8px;
      padding: 2px 6px;
      text-align: center;
      min-height: 26px;
      border: 1px solid #ffccd5;
      flex-shrink: 0;
    }
    .result-title { font-size: 12px; font-weight: bold; color: #ff5577; }
    .yaku-list { font-size: 10px; color: #665560; }
    .score-detail { font-size: 11px; color: #009688; font-weight: bold; }
    .error-msg { font-size: 9px; color: #e53935; }

    /* モーダル表示領域 */
    .modal-overlay {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background: rgba(30, 20, 25, 0.94);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;
      z-index: 100 !important;
      padding: 10px;
      text-align: center;
      overflow-y: auto;
    }
    .modal-title { font-size: 15px; font-weight: bold; color: #ffffff; text-shadow: 0 0 6px #ff7799; }
    .modal-desc { font-size: 10px; color: #ffe6ec; }

    #dodge-canvas {
      background: #11080c;
      border: 2px solid #ff88aa;
      border-radius: 6px;
      max-width: 100%;
    }

    .dpad-container {
      display: grid;
      grid-template-columns: repeat(3, 34px);
      grid-template-rows: repeat(2, 34px);
      gap: 3px;
      justify-content: center;
    }
    .dpad-btn {
      background: #ffb6c1;
      border: 1px solid #ff88aa;
      color: #ffffff;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .quiz-options { display: flex; flex-direction: column; gap: 4px; width: 100%; max-width: 240px; }
    .quiz-btn { background: #ffffff; border: 1px solid #ff88aa; color: #ff5577; padding: 5px; border-radius: 8px; font-weight: bold; font-size: 10px; }
    
    .flash-num {
      font-size: 38px;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 0 0 10px #ff7799;
      height: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .flash-input { font-size: 14px; padding: 2px; width: 90px; text-align: center; border: 1px solid #ff88aa; border-radius: 6px; }

    .coin-img { font-size: 32px; }

    .mentsu-option-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      background: #ffffff;
      border: 1px solid #ff88aa;
      padding: 3px 6px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      max-width: 280px;
    }

    .game-footer { display: none; }
  </style>
</head>
<body>

  <div id="bg-layer"></div>

  <h1>🌸 ふわふわ麻雀 🌸</h1>

  <details class="rules-details">
    <summary class="rules-summary"><span>📜 全体ルールを見る</span><span>▼</span></summary>
    <div class="rules-content">
      <ul>
        <li><b>HP</b>: 初期1000。毎打牌-50（0でゲームオーバー）。</li>
        <li><b>リーチ中</b>: 打牌によるHP減少が停止！</li>
        <li><b>面子犠牲・カン</b>: HP回復可能（キャンセル可）。</li>
        <li><b>リーチ試練</b>: コイントス または「丁と半」から選択可能！</li>
        <li><b>10打牌ごと</b>: ミニゲームや手牌シャッフルが発生。</li>
      </ul>
    </div>
  </details>

  <div class="volume-container">
    <span>🔊</span>
    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.3" oninput="updateVolume(this.value)">
    <button id="bgm-toggle-btn" class="bgm-btn" onclick="toggleBGM()">🎵 BGM: OFF</button>
  </div>

  <div class="hp-container">
    <div class="hp-header">
      <span>たいりょく (HP)</span>
      <span id="hp-text">1000 / 1000</span>
    </div>
    <div class="hp-bar-outer">
      <div id="hp-bar" class="hp-bar-inner"></div>
    </div>
  </div>

  <div class="game-layout">
    <div class="game-board" id="game-board">
      <div class="info-bar">
        <div>自風: <span style="color:#ff5577;">東家</span></div>
        <div>残り: <span id="deck-count">0</span></div>
        <div>打牌: <span id="turn-count">0</span></div>
        <div class="dora-area">
          <span>ドラ:</span>
          <div id="dora-tile-container" style="display:flex; gap:1px;"></div>
        </div>
        <div id="riichi-badge" class="status-badge">リーチ中</div>
      </div>

      <div class="tenpai-info-bar" id="tenpai-info-bar">
        <span>待ち:</span>
        <div id="waits-container" style="display:flex; gap:2px; flex-wrap:wrap;">なし</div>
      </div>

      <div class="river-section">
        <div class="river-title">すてた牌</div>
        <div id="river" class="tile-container"></div>
      </div>

      <div class="hand-section">
        <div id="hand" class="hand-tiles-area"></div>
        <div class="drawn-tile-area">
          <div id="drawn-tile"></div>
        </div>
      </div>

      <div class="result-box" id="result-box">
        <div class="result-title" id="msg-title"></div>
        <div class="yaku-list" id="msg-yaku"></div>
        <div class="score-detail" id="msg-score"></div>
        <div class="error-msg" id="msg-error"></div>
      </div>

      <div class="controls">
        <button id="btn-sacrifice" class="btn-sacrifice" onclick="onClickSacrificeButton()" style="display:none;">面子回復</button>
        <button id="btn-kyushu" class="btn-kyushu" onclick="execKyushuKyuhai()" style="display:none;">九種九牌</button>
        <button id="btn-kan" class="btn-kan" onclick="onClickKanButton()" style="display:none;">カン</button>
        <button id="btn-riichi" class="btn-riichi" onclick="startRiichiSelect()" disabled>リーチ</button>
        <button id="btn-win" onclick="startAgariSequence()">ツモアガリ</button>
        <button onclick="sortHand()">理牌</button>
        <button onclick="initGame()">最初から</button>
      </div>

      <div id="game-modal" class="modal-overlay" style="display:none;">
        <div class="modal-title" id="modal-title">イベント発生</div>
        <div class="modal-desc" id="modal-desc">説明文</div>
        <div id="modal-content"></div>
      </div>
    </div>

    <details class="ranking-board">
      <summary class="ranking-summary">
        <span>✨ 英雄一覧</span>
        <span style="font-size:9px;">(開閉)</span>
      </summary>
      <div class="ranking-content">
        <ol class="ranking-list" id="ranking-list">
          <li class="ranking-item" style="text-align:center;">読込中...</li>
        </ol>
        <div style="text-align: center; margin-top: 4px;">
          <button onclick="fetchGlobalRanking()" style="padding: 2px 6px; font-size: 9px;">更新</button>
        </div>
      </div>
    </details>
  </div>

  <script>
    const SUPABASE_URL = 'https://fxexiflthgohhqafddhr.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_0iMq0Jf5FmetEP1Ktw2VYg_W3lGJmjz';
    
    let supabaseClient = null;
    if (SUPABASE_URL !== 'YOUR_SUPABASE_URL') {
      supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    const BG_IMAGES = { normal: './bg_normal.jpg', death: './bg_death.jpg' };
    const BGM_URLS = { normal: './bgm_normal.mp3', riichi: './bgm_riichi.mp3' };

    function updateBackgroundImage(isDeath = false) {
      const bgLayer = document.getElementById('bg-layer');
      if (!bgLayer) return;
      const targetImg = isDeath ? BG_IMAGES.death : BG_IMAGES.normal;
      if (targetImg) {
        bgLayer.style.backgroundImage = `url('${targetImg}')`;
        setTimeout(() => bgLayer.classList.add('active'), 50);
      } else {
        bgLayer.classList.remove('active');
      }
    }

    let currentBgmAudio = null;
    let isBgmEnabled = false;

    function toggleBGM() {
      initAudio();
      isBgmEnabled = !isBgmEnabled;
      const btn = document.getElementById('bgm-toggle-btn');
      if (isBgmEnabled) {
        btn.innerText = '🎵 BGM: ON';
        btn.classList.add('active');
        playBGM(isRiichi ? 'riichi' : 'normal');
      } else {
        btn.innerText = '🎵 BGM: OFF';
        btn.classList.remove('active');
        stopBGM();
      }
    }

    function playBGM(type) {
      if (!isBgmEnabled) return;
      const url = BGM_URLS[type];
      if (!url) return;
      if (currentBgmAudio && currentBgmAudio.src.includes(url.replace('./', ''))) return;
      stopBGM();
      currentBgmAudio = new Audio(url);
      currentBgmAudio.loop = true;
      currentBgmAudio.volume = globalVolume;
      currentBgmAudio.play().catch(e => console.log('BGM Error:', e));
    }

    function stopBGM() {
      if (currentBgmAudio) { currentBgmAudio.pause(); currentBgmAudio = null; }
    }

    let globalVolume = 0.3;
    function updateVolume(val) {
      globalVolume = parseFloat(val);
      if (currentBgmAudio) currentBgmAudio.volume = globalVolume;
    }

    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSE(type) {
      if (globalVolume <= 0) return;
      initAudio();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);

      if (type === 'discard') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(120, now + 0.08);
        gain.gain.setValueAtTime(0.5 * globalVolume, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.start(now); osc.stop(now + 0.08);
      } else if (type === 'flash_tick' || type === 'count_tick') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(987.77, now);
        osc.frequency.exponentialRampToValueAtTime(1318.51, now + 0.06);
        gain.gain.setValueAtTime(0.4 * globalVolume, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
        osc.start(now); osc.stop(now + 0.06);
      } else if (type === 'count_zero') {
        osc.type = 'square'; osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.15);
        gain.gain.setValueAtTime(0.5 * globalVolume, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.start(now); osc.stop(now + 0.15);
      } else if (type === 'damage') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(120, now);
        osc.frequency.linearRampToValueAtTime(40, now + 0.2);
        gain.gain.setValueAtTime(0.6 * globalVolume, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
      } else if (type === 'death') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(20, now + 1.2);
        gain.gain.setValueAtTime(1.0 * globalVolume, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
        osc.start(now); osc.stop(now + 1.2);
      } else if (type === 'destroy') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(100, now + 0.5);
        gain.gain.setValueAtTime(0.7 * globalVolume, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
        osc.start(now); osc.stop(now + 0.5);
      } else if (type === 'heal') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.25);
        gain.gain.setValueAtTime(0.4 * globalVolume, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.start(now); osc.stop(now + 0.25);
      } else if (type === 'event') {
        osc.type = 'square'; osc.frequency.setValueAtTime(300, now);
        osc.frequency.setValueAtTime(600, now + 0.1);
        gain.gain.setValueAtTime(0.3 * globalVolume, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
      } else if (type === 'riichi') {
        osc.type = 'square'; osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.08);
        osc.frequency.setValueAtTime(783.99, now + 0.16);
        gain.gain.setValueAtTime(0.3 * globalVolume, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
      } else if (type === 'win') {
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
          const o = audioCtx.createOscillator(), g = audioCtx.createGain();
          o.type = 'triangle'; o.frequency.value = freq;
          const st = now + i * 0.12, dur = i === 3 ? 0.7 : 0.14;
          g.gain.setValueAtTime(0.3 * globalVolume, st); g.gain.exponentialRampToValueAtTime(0.001, st + dur);
          o.connect(g); g.connect(audioCtx.destination);
          o.start(st); o.stop(st + dur);
        });
      } else if (type === 'error') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now);
        gain.gain.setValueAtTime(0.2 * globalVolume, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.start(now); osc.stop(now + 0.25);
      } else if (type === 'sort') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(1200, now);
        osc.frequency.exponentialRampToValueAtTime(400, now + 0.1);
        gain.gain.setValueAtTime(0.2 * globalVolume, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
      }
    }

    const SUITS = { m: '萬', p: '筒', s: '索' };
    const HONORS = ['東', '南', '西', '北', '白', '發', '中'];
    const YAOCHU_KEYS = ['m_1','m_9','p_1','p_9','s_1','s_9','z_1','z_2','z_3','z_4','z_5','z_6','z_7'];

    let deck = [], hand = [], drawnTile = null, river = [];
    let doraIndicators = [], actualDoraTiles = [];
    let kanCount = 0;
    let turn = 0;
    let lastSacrificeTurn = -5;
    let isRiichi = false, isRiichiSelecting = false, isGameOver = false;
    let autoDiscardTimer = null;
    let flashCountdownTimer = null;
    let hp = 1000;
    const MAX_HP = 1000;
    let keys = {};

    const QUIZ_DB = [
      { q: "麻雀のローカル役で実在するのは？", a: "十三不塔", b: "九蓮宝塔", ans: "a" },
      { q: "光の速度はどっちが近い？", a: "秒速30万km", b: "秒速300万km", ans: "a" },
      { q: "日本で一番広い都道府県は？", a: "北海道", b: "岩手県", ans: "a" },
      { q: "将棋の盤面はマス目がいくつ？", a: "81マス", b: "64マス", ans: "a" },
      { q: "富士山の標高は？", a: "3776m", b: "3876m", ans: "a" },
      { q: "世界で一番面積が大きい国は？", a: "ロシア", b: "カナダ", ans: "a" },
      { q: "オーストラリアの首都は？", a: "キャンベラ", b: "シドニー", ans: "a" },
      { q: "ブラジルの公用語は？", a: "ポルトガル語", b: "スペイン語", ans: "a" },
      { q: "エジプトの首都は？", a: "カイロ", b: "アレクサンドリア", ans: "a" },
      { q: "世界で一番長い川は？", a: "ナイル川", b: "アマゾン川", ans: "a" },
      { q: "元素記号「Fe」は何の金属？", a: "鉄", b: "フッ素", ans: "a" },
      { q: "太陽系の惑星で最大のものは？", a: "木星", b: "土星", ans: "a" },
      { q: "ヒトの体で最も重い臓器は？", a: "肝臓", b: "皮膚", ans: "a" },
      { q: "水の化学式はどれ？", a: "H2O", b: "CO2", ans: "a" }
    ];
    for(let i=0; i<30; i++) {
      let n1 = Math.floor(Math.random()*89)+10;
      let n2 = Math.floor(Math.random()*89)+10;
      QUIZ_DB.push({ q: `計算クイズ: ${n1} × ${n2} の一の位は？`, a: `${(n1*n2)%10}`, b: `${((n1*n2)+3)%10}`, ans: "a" });
    }

    function createDeck() {
      let tiles = [];
      let idCounter = 1;
      ['m', 'p', 's'].forEach(s => {
        for (let n = 1; n <= 9; n++) {
          for (let i = 0; i < 4; i++) {
            let isAka = (n === 5 && i === 0);
            tiles.push({ id: idCounter++, type: s, val: n, isAka: isAka });
          }
        }
      });
      HONORS.forEach((_, idx) => {
        for (let i = 0; i < 4; i++) tiles.push({ id: idCounter++, type: 'z', val: idx + 1, isAka: false });
      });
      return tiles.sort(() => Math.random() - 0.5);
    }

    function getDoraFromIndicator(ind) {
      if (ind.type === 'z') {
        if (ind.val <= 4) return { type: 'z', val: ind.val === 4 ? 1 : ind.val + 1 };
        else return { type: 'z', val: ind.val === 7 ? 5 : ind.val + 1 };
      } else {
        return { type: ind.type, val: ind.val === 9 ? 1 : ind.val + 1 };
      }
    }

    function isTileDora(tile) {
      if (!tile) return false;
      if (tile.isAka) return true;
      return actualDoraTiles.some(dt => dt.type === tile.type && dt.val === tile.val);
    }

    function updateHP(amount) {
      hp += amount;
      if (hp > MAX_HP) hp = MAX_HP;
      if (hp <= 0) {
        hp = 0;
        isGameOver = true;
        document.body.classList.add('death-mode');
        updateBackgroundImage(true);
        playSE('death');
        stopBGM();
        showMessage('💀 GAME OVER 💀', '精神力が尽きた...。あなたの負けです。', '');
      }
      document.getElementById('hp-text').innerText = `${hp} / ${MAX_HP}`;
      document.getElementById('hp-bar').style.width = `${(hp / MAX_HP) * 100}%`;
    }

    function initGame() {
      if (autoDiscardTimer) clearTimeout(autoDiscardTimer);
      if (flashCountdownTimer) clearInterval(flashCountdownTimer);
      document.body.classList.remove('death-mode');
      updateBackgroundImage(false);

      deck = createDeck();
      hand = []; river = []; turn = 0; kanCount = 0; hp = MAX_HP;
      lastSacrificeTurn = -5;
      isRiichi = false; isRiichiSelecting = false; isGameOver = false;

      doraIndicators = [deck.pop()];
      actualDoraTiles = [getDoraFromIndicator(doraIndicators[0])];

      document.getElementById('riichi-badge').style.display = 'none';
      closeModal();
      clearMessages();
      updateHP(0);
      playBGM('normal');

      for (let i = 0; i < 13; i++) hand.push(deck.pop());
      sortTiles(hand);
      drawTile();
      render();
      fetchGlobalRanking();
    }

    function drawTile() {
      if (deck.length === 0) {
        if (river.length > 0) {
          playSE('heal');
          deck = [...river].sort(() => Math.random() - 0.5);
          river = [];
          updateHP(500);
          openModal("🔄 山札リセット！", "捨て牌が山札に戻りHP500回復！", "");
          setTimeout(() => closeModal(), 1500);
        } else {
          showMessage('流局', '引ける牌がありません。', '');
          isGameOver = true;
          drawnTile = null;
          return;
        }
      }
      drawnTile = deck.pop();

      if (isRiichi && !isGameOver) {
        const fullTiles = [...hand, drawnTile];
        if (!checkWin(fullTiles)) {
          if (autoDiscardTimer) clearTimeout(autoDiscardTimer);
          autoDiscardTimer = setTimeout(() => {
            if (!isGameOver && isRiichi) discard(null, true);
          }, 350);
        }
      }
    }

    function sortTiles(arr) {
      const order = { m: 1, p: 2, s: 3, z: 4 };
      arr.sort((a, b) => (order[a.type] !== order[b.type]) ? order[a.type] - order[b.type] : a.val - b.val);
    }

    function sortHand() {
      if (isGameOver || isRiichi) return;
      playSE('sort');
      sortTiles(hand);
      render();
    }

    function discard(index, isDrawn, isFree = false) {
      if (isGameOver) return;
      if (autoDiscardTimer) clearTimeout(autoDiscardTimer);

      let discarded;
      if (isDrawn) {
        discarded = drawnTile;
        drawnTile = null;
      } else {
        discarded = hand.splice(index, 1)[0];
        if (drawnTile) {
          hand.push(drawnTile);
          drawnTile = null;
          sortTiles(hand);
        }
      }

      river.push(discarded);
      playSE('discard');

      if (!isFree && !isRiichi) {
        let dmg = isTileDora(discarded) ? -100 : -50;
        updateHP(dmg);
        if (isGameOver) { render(); return; }
        playSE('damage');
      }

      if (isRiichiSelecting) {
        isRiichi = true;
        isRiichiSelecting = false;
        playSE('riichi');
        playBGM('riichi');
        document.getElementById('riichi-badge').style.display = 'inline-block';
      }

      turn++;
      render();

      if (turn > 0 && turn % 10 === 0) {
        triggerRandom10Event();
      } else {
        drawTile();
        render();
      }
    }

    function shuffleAllHandTiles() {
      let count = hand.length + (drawnTile ? 1 : 0);
      hand = [];
      let newAddedIds = [];
      for(let i=0; i<count-1; i++) {
        let t = deck.pop();
        hand.push(t);
        newAddedIds.push(t.id);
      }
      drawnTile = deck.pop();
      if(drawnTile) newAddedIds.push(drawnTile.id);
      sortTiles(hand);
      render(newAddedIds, []);
    }

    function removeRandomTiles(num, callback) {
      closeModal();
      setTimeout(() => {
        playSE('destroy');
        let targetTileIds = [];
        let newAddedTileIds = [];

        for (let i = 0; i < num; i++) {
          if (drawnTile && Math.random() < 0.2) {
            targetTileIds.push(drawnTile.id);
            let newTile = deck.pop();
            drawnTile = newTile;
            if (newTile) newAddedTileIds.push(newTile.id);
          } else if (hand.length > 0) {
            let idx = Math.floor(Math.random() * hand.length);
            targetTileIds.push(hand[idx].id);
            let newTile = deck.pop();
            hand[idx] = newTile;
            if (newTile) newAddedTileIds.push(newTile.id);
          }
        }

        let allTileElements = document.querySelectorAll('.tile');
        allTileElements.forEach(el => {
          let tileId = parseInt(el.dataset.id);
          if (targetTileIds.includes(tileId)) el.classList.add('destroying');
        });

        setTimeout(() => {
          sortTiles(hand);
          render(newAddedTileIds, []);
          if (callback) callback();
        }, 650);
      }, 50);
    }

    function countYaochuTypes(tiles) {
      let set = new Set();
      tiles.forEach(t => {
        let key = `${t.type}_${t.val}`;
        if (YAOCHU_KEYS.includes(key)) set.add(key);
      });
      return set.size;
    }

    function execKyushuKyuhai() {
      if (isGameOver) return;
      playSE('sort');
      openModal("🀄 九種九牌", "山札に戻して引き直します！", "");
      const fullTiles = [...hand];
      if (drawnTile) fullTiles.push(drawnTile);
      deck = [...deck, ...fullTiles].sort(() => Math.random() - 0.5);
      hand = [];
      drawnTile = null;

      setTimeout(() => {
        let newIds = [];
        for (let i = 0; i < 13; i++) {
          let t = deck.pop();
          hand.push(t);
          newIds.push(t.id);
        }
        sortTiles(hand);
        drawTile();
        if (drawnTile) newIds.push(drawnTile.id);
        closeModal();
        render(newIds, []);
      }, 1200);
    }

    function findAvailableMentsu(tiles) {
      let counts = getTileCounts(tiles);
      let list = [];
      for (let k in counts) {
        if (counts[k] >= 3) {
          let [type, valStr] = k.split('_'), val = parseInt(valStr);
          let matched = tiles.filter(t => t.type === type && t.val === val).slice(0, 3);
          list.push({ type: 'kotsu', tiles: matched });
        }
      }
      ['m', 'p', 's'].forEach(type => {
        for (let n = 1; n <= 7; n++) {
          let t1 = tiles.find(t => t.type === type && t.val === n);
          let t2 = tiles.find(t => t.type === type && t.val === n + 1);
          let t3 = tiles.find(t => t.type === type && t.val === n + 2);
          if (t1 && t2 && t3) list.push({ type: 'shuntsu', tiles: [t1, t2, t3] });
        }
      });
      return list;
    }

    function onClickSacrificeButton() {
      if (isGameOver) return;
      if (turn - lastSacrificeTurn < 5) return;
      const fullTiles = [...hand];
      if (drawnTile) fullTiles.push(drawnTile);
      let mentsuList = findAvailableMentsu(fullTiles);
      if (mentsuList.length === 0) return;

      let html = '<div style="display:flex; flex-direction:column; gap:4px; width:100%; align-items:center;">';
      mentsuList.forEach((m, idx) => {
        let hasDora = m.tiles.some(t => isTileDora(t));
        let healAmt = hasDora ? 400 : 200;
        html += `<div class="mentsu-option-btn" onclick="execSacrificeMentsuByIndex(${idx});">`;
        html += '<div style="display:flex; gap:1px;">';
        m.tiles.forEach(t => { html += createTileElement(t, null, true).outerHTML; });
        html += '</div>';
        html += `<span style="color:${hasDora ? '#ff9800' : '#4db6ac'}; font-weight:bold; font-size:10px;">捧げる (+${healAmt})</span></div>`;
      });
      html += `<button class="btn-cancel" onclick="closeModal()">キャンセル</button>`;
      html += '</div>';
      window.currentMentsuList = mentsuList;
      openModal("面子犠牲選択", "ドラ含むと+400回復", html);
    }

    function execSacrificeMentsuByIndex(idx) {
      if (window.currentMentsuList && window.currentMentsuList[idx]) {
        closeModal();
        execSacrificeMentsu(window.currentMentsuList[idx]);
      }
    }

    function execSacrificeMentsu(mentsuObj) {
      let hasDora = mentsuObj.tiles.some(t => isTileDora(t));
      let healAmount = hasDora ? 400 : 200;
      closeModal();
      lastSacrificeTurn = turn;

      setTimeout(() => {
        playSE('destroy');
        let destroyIds = mentsuObj.tiles.map(t => t.id);
        document.querySelectorAll('.tile').forEach(el => {
          if (destroyIds.includes(parseInt(el.dataset.id))) el.classList.add('destroying');
        });

        setTimeout(() => {
          mentsuObj.tiles.forEach(target => {
            if (drawnTile && drawnTile.id === target.id) drawnTile = null;
            else {
              let idx = hand.findIndex(t => t.id === target.id);
              if (idx !== -1) hand.splice(idx, 1);
            }
          });
          updateHP(healAmount);
          let newIds = [];
          playSE('heal');
          for(let i = 0; i < 3; i++) {
            if (deck.length > 0) { let t = deck.pop(); hand.push(t); newIds.push(t.id); }
          }
          sortTiles(hand);
          if (!drawnTile && deck.length > 0) { drawnTile = deck.pop(); if (drawnTile) newIds.push(drawnTile.id); }
          render(newIds, []);
        }, 600);
      }, 50);
    }

    function onClickKanButton() {
      if (isGameOver) return;
      const fullTiles = [...hand];
      if (drawnTile) fullTiles.push(drawnTile);
      let counts = getTileCounts(fullTiles);
      let kanKeys = Object.keys(counts).filter(k => counts[k] === 4);
      if (kanKeys.length === 0) return;
      if (kanKeys.length === 1) execKan(kanKeys[0]);
      else showKanModal(kanKeys);
    }

    function showKanModal(kanKeys) {
      let html = '<div style="display:flex; gap:6px; flex-direction:column; align-items:center;">';
      kanKeys.forEach(key => {
        let [type, valStr] = key.split('_');
        html += `<button onclick="closeModal(); execKan('${key}');">${valStr}${SUITS[type]||'字'}</button>`;
      });
      html += `<button class="btn-cancel" onclick="closeModal()">キャンセル</button>`;
      html += '</div>';
      openModal("カンする牌を選択", "", html);
    }

    function execKan(kanKey) {
      let [type, valStr] = kanKey.split('_');
      let val = parseInt(valStr);
      const fullTiles = [...hand];
      if (drawnTile) fullTiles.push(drawnTile);

      let targetTiles = fullTiles.filter(t => t.type === type && t.val === val);
      let hasDora = targetTiles.some(t => isTileDora(t));
      let healAmount = hasDora ? 500 : 300;

      targetTiles.forEach(t => river.push(t));
      if (drawnTile && drawnTile.type === type && drawnTile.val === val) drawnTile = null;
      hand = hand.filter(t => !(t.type === type && t.val === val));
      kanCount++;
      playSE('heal');
      updateHP(healAmount);

      if (deck.length > 0) {
        let newDoraInd = deck.pop();
        doraIndicators.push(newDoraInd);
        actualDoraTiles.push(getDoraFromIndicator(newDoraInd));
      }

      if (kanCount >= 4) {
        showMessage('流局（四開槓）', 'カンが4回に達しました。', '');
        isGameOver = true;
        render();
        return;
      }

      openModal("🀄 カン成功！", `HPが ${healAmount} 回復！`, "");
      setTimeout(() => {
        closeModal();
        drawTile();
        render(drawnTile ? [drawnTile.id] : []);
      }, 1000);
    }

    function triggerRandom10Event() {
      playSE('event');
      let r = Math.random();
      if (r < 0.25) {
        openModal("😈 災難イベント", "手牌がすべて山札と入れ替わりました！", "");
        shuffleAllHandTiles();
        setTimeout(() => { closeModal(); drawTile(); render(); }, 1500);
      } else if (r < 0.50) {
        startQuizEvent(() => { drawTile(); render(); }, null);
      } else if (r < 0.75) {
        startDodgeGame(() => { drawTile(); render(); }, null);
      } else {
        startFlashMathEvent(() => { drawTile(); render(); }, null);
      }
    }

    // リーチ選択（コイントス or 丁と半）
    function startRiichiSelect() {
      if (isRiichi || isGameOver) return;
      playSE('event');
      openModal("リーチ試練の選択", "どちらの試練でリーチを賭けますか？", `
        <div style="display:flex; flex-direction:column; gap:6px; width:100%; max-width:220px; align-items:center;">
          <button onclick="startCoinTossGame()" style="width:100%;">🪙 コイントス (3回表)</button>
          <button onclick="startChohanGame()" style="width:100%;">🎲 丁と半 (2回勝負)</button>
          <button class="btn-cancel" onclick="closeModal()">キャンセル</button>
        </div>
      `);
    }

    let coinSuccessCount = 0;
    function startCoinTossGame() {
      coinSuccessCount = 0;
      openModal("🪙 コイントス試練", "3回連続「表」で成功！失敗で牌が3つ消滅！", `
        <div id='coin-area'>
          <div class='coin-img'>🪙</div>
          <button onclick='execCoinToss()' style='margin-top:6px;'>コインを投げる</button>
          <div style="margin-top:4px;"><button class="btn-cancel" onclick="startRiichiSelect()">戻る</button></div>
        </div>
      `);
    }

    function execCoinToss() {
      let coinArea = document.getElementById('coin-area');
      let win = Math.random() < 0.5;
      if (win) {
        coinSuccessCount++;
        coinArea.innerHTML = `<div class='coin-img'>🪙</div><p style='color:#4db6ac; font-size:11px;'>成功！ (${coinSuccessCount}/3)</p>`;
        if (coinSuccessCount >= 3) {
          coinSuccessCount = 0;
          setTimeout(() => {
            closeModal();
            isRiichiSelecting = true;
            showMessage('立直準備', '切る牌を選択してください。', '');
            render();
          }, 800);
        } else {
          coinArea.innerHTML += `<button onclick='execCoinToss()' style='margin-top:4px;'>次を投げる</button>`;
        }
      } else {
        coinSuccessCount = 0;
        coinArea.innerHTML = `<div class='coin-img'>💥</div><p style='color:#e53935; font-size:11px;'>失敗！牌が3つ暴発！</p>`;
        removeRandomTiles(3, () => { setTimeout(() => closeModal(), 800); });
      }
    }

    let chohanTryCount = 0;
    function startChohanGame() {
      chohanTryCount = 0;
      showChohanPrompt();
    }

    function showChohanPrompt() {
      openModal("🎲 丁と半 試練", `残り挑戦: ${2 - chohanTryCount}回<br>壺の中は「丁（偶数）」か「半（奇数）」か？`, `
        <div style="display:flex; gap:8px; justify-content:center; margin-top:6px;">
          <button onclick="execChohan('cho')" style="background:#e53935; padding:6px 12px;">🔴 丁</button>
          <button onclick="execChohan('han')" style="background:#1e88e5; padding:6px 12px;">🔵 半</button>
        </div>
        <div style="margin-top:6px;"><button class="btn-cancel" onclick="startRiichiSelect()">戻る</button></div>
      `);
    }

    function execChohan(playerChoice) {
      let diceSum = Math.floor(Math.random() * 6) + 1 + Math.floor(Math.random() * 6) + 1;
      let actual = (diceSum % 2 === 0) ? 'cho' : 'han';

      if (playerChoice === actual) {
        chohanTryCount++;
        if (chohanTryCount >= 2) {
          openModal("✨ 丁と半 クリア！", `出目は ${diceSum}（${actual === 'cho' ? '丁' : '半'}）！2回連続的中！`, "");
          setTimeout(() => {
            closeModal();
            isRiichiSelecting = true;
            showMessage('立直準備', '切る牌を選択してください。', '');
            render();
          }, 1000);
        } else {
          openModal("⭕ 的中！", `出目は ${diceSum}！あと1回当てろ！`, `
            <button onclick="showChohanPrompt()" style="margin-top:6px;">次の勝負へ</button>
          `);
        }
      } else {
        chohanTryCount = 0;
        openModal("❌ 外れ！", `出目は ${diceSum}（${actual === 'cho' ? '丁' : '半'}）！牌が3つ暴発！`, "");
        removeRandomTiles(3, () => { setTimeout(() => closeModal(), 800); });
      }
    }

    function cancelRiichiOnAgariFail() {
      if (isRiichi) {
        isRiichi = false;
        playBGM('normal');
        document.getElementById('riichi-badge').style.display = 'none';
        showMessage('⚠️ リーチ解除', '試練失敗によりリーチ解除', '');
      }
      setTimeout(() => { closeModal(); render(); }, 1200);
    }

    function startAgariSequence() {
      const fullTiles = [...hand];
      if (drawnTile) fullTiles.push(drawnTile);
      let expectedCount = 14 - (kanCount * 3);
      if (fullTiles.length !== expectedCount) return;

      if (!checkWin(fullTiles)) {
        playSE('error');
        showMessage('❌ チョンボ', 'まだアガリ形ではありません。', '');
        return;
      }

      playSE('event');
      openModal("和了の試練 (1/3)", "第1試練：弾幕を避けろ！失敗で牌が5個飛んでリーチ解除", "");
      startDodgeGame(() => {
        startQuizEvent(() => {
          startFlashMathEvent(() => {
            checkAgariFinal();
          }, cancelRiichiOnAgariFail);
        }, cancelRiichiOnAgariFail);
      }, cancelRiichiOnAgariFail);
    }

    async function checkAgariFinal() {
      const fullTiles = [...hand];
      if (drawnTile) fullTiles.push(drawnTile);
      if (checkWin(fullTiles)) {
        playSE('win');
        let res = evaluateHand(fullTiles, isRiichi);
        let yakuStr = res.yakus.map(y => `${y.name}`).join('・');
        openModal("🎉 奇跡達成！ 🎉", "おめでとう！生還者として歴史に名を刻もう！", "");
        showMessage(`🎉 生還！（打牌:${turn}）`, yakuStr, res.scoreText);
        isGameOver = true;
        render();

        setTimeout(async () => {
          let playerName = prompt('おめでとう！生還者として名前を入力してください:', '生還者');
          if (playerName) await saveGlobalScore(playerName, turn, hp, res.rawScore, res.scoreText, yakuStr);
        }, 1000);
      }
    }

    function startQuizEvent(onSuccess, onFailure) {
      let q = QUIZ_DB[Math.floor(Math.random() * QUIZ_DB.length)];
      openModal("🧠 クイズ試練", q.q, `
        <div class="quiz-options">
          <button class="quiz-btn" onclick="checkQuizAns('a', '${q.ans}')">${q.a}</button>
          <button class="quiz-btn" onclick="checkQuizAns('b', '${q.ans}')">${q.b}</button>
        </div>
      `);
      window.currentQuizSuccess = onSuccess;
      window.currentQuizFailure = onFailure;
    }

    function checkQuizAns(userAns, correctAns) {
      if (userAns === correctAns) {
        openModal("⭕ 正解！", "難を逃れた...", "");
        setTimeout(() => { closeModal(); window.currentQuizSuccess(); }, 800);
      } else {
        openModal("❌ 不正解！", "牌が1つ飛びます！", "");
        removeRandomTiles(1, () => {
          if (window.currentQuizFailure) window.currentQuizFailure();
          else setTimeout(() => closeModal(), 800);
        });
      }
    }

    function setTouchKey(key, state) { keys[key] = state; }

    function startDodgeGame(onSuccess, onFailure) {
      openModal("⚡ 回避試練", "5秒後にカウントダウン！ボタンで避けろ！", `
        <div id="dodge-timer" style="font-size:20px; color:#ffffff; font-weight:bold; margin-bottom:2px;">5</div>
        <canvas id="dodge-canvas" width="260" height="130"></canvas>
        <div class="dpad-container" style="margin-top:4px;">
          <div></div>
          <div class="dpad-btn" onmousedown="setTouchKey('ArrowUp', true)" onmouseup="setTouchKey('ArrowUp', false)" ontouchstart="setTouchKey('ArrowUp', true); event.preventDefault();" ontouchend="setTouchKey('ArrowUp', false)">▲</div>
          <div></div>
          <div class="dpad-btn" onmousedown="setTouchKey('ArrowLeft', true)" onmouseup="setTouchKey('ArrowLeft', false)" ontouchstart="setTouchKey('ArrowLeft', true); event.preventDefault();" ontouchend="setTouchKey('ArrowLeft', false)">◄</div>
          <div class="dpad-btn" onmousedown="setTouchKey('ArrowDown', true)" onmouseup="setTouchKey('ArrowDown', false)" ontouchstart="setTouchKey('ArrowDown', true); event.preventDefault();" ontouchend="setTouchKey('ArrowDown', false)">▼</div>
          <div class="dpad-btn" onmousedown="setTouchKey('ArrowRight', true)" onmouseup="setTouchKey('ArrowRight', false)" ontouchstart="setTouchKey('ArrowRight', true); event.preventDefault();" ontouchend="setTouchKey('ArrowRight', false)">►</div>
        </div>
      `);

      let count = 5;
      playSE('count_tick');
      let timer = setInterval(() => {
        count--;
        let el = document.getElementById('dodge-timer');
        if (el) el.innerText = count;
        if (count > 0) playSE('count_tick');
        else if (count === 0) playSE('count_zero');

        if (count <= 0) {
          clearInterval(timer);
          runDodgeEngine(onSuccess, onFailure);
        }
      }, 1000);
    }

    function runDodgeEngine(onSuccess, onFailure) {
      const canvas = document.getElementById('dodge-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let px = 120, py = 55, pSize = 12;
      let bullets = [];
      let duration = 8.0;
      let gameActive = true;

      const keyHandler = (e) => { keys[e.key] = e.type === 'keydown'; };
      window.addEventListener('keydown', keyHandler);
      window.addEventListener('keyup', keyHandler);

      for(let i = 0; i < 12; i++) {
        bullets.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, vx: (Math.random() - 0.5) * 1.6, vy: (Math.random() - 0.5) * 1.6 });
      }

      let lastTime = performance.now();
      function loop(now) {
        if (!gameActive) return;
        let dt = (now - lastTime) / 1000;
        lastTime = now;
        duration -= dt;

        let timerEl = document.getElementById('dodge-timer');
        if (timerEl) timerEl.innerText = `残り: ${Math.max(0, duration).toFixed(1)}秒`;

        const speed = 2.5;
        if (keys['ArrowUp'] && py > 0) py -= speed;
        if (keys['ArrowDown'] && py < canvas.height - pSize) py += speed;
        if (keys['ArrowLeft'] && px > 0) px -= speed;
        if (keys['ArrowRight'] && px < canvas.width - pSize) px += speed;

        ctx.fillStyle = '#11080c';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#ff88aa';
        ctx.lineWidth = 2;
        ctx.strokeRect(px, py, pSize, pSize);

        ctx.fillStyle = '#ffffff';
        for (let b of bullets) {
          b.x += b.vx; b.y += b.vy;
          if (b.x < 0 || b.x > canvas.width) b.vx *= -1;
          if (b.y < 0 || b.y > canvas.height) b.vy *= -1;
          ctx.beginPath(); ctx.arc(b.x, b.y, 3.5, 0, Math.PI * 2); ctx.fill();

          if (px < b.x + 3.5 && px + pSize > b.x - 3.5 && py < b.y + 3.5 && py + pSize > b.y - 3.5) {
            gameActive = false;
            window.removeEventListener('keydown', keyHandler);
            window.removeEventListener('keyup', keyHandler);
            keys = {};
            openModal("💥 被弾！", "牌が5個飛びます！", "");
            removeRandomTiles(5, () => {
              if (onFailure) onFailure();
              else setTimeout(() => closeModal(), 800);
            });
            return;
          }
        }

        if (duration <= 0) {
          gameActive = false;
          window.removeEventListener('keydown', keyHandler);
          window.removeEventListener('keyup', keyHandler);
          keys = {};
          openModal("✨ 回避成功！", "見事に避け切った！", "");
          setTimeout(() => { closeModal(); onSuccess(); }, 800);
          return;
        }
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    }

    function startFlashMathEvent(onSuccess, onFailure) {
      if (flashCountdownTimer) clearInterval(flashCountdownTimer);
      openModal("⚡ フラッシュ暗算", "数字の合計を答えろ！", "<div id='flash-box' class='flash-num'>READY</div>");

      let numbers = [];
      for(let i=0; i<5; i++) numbers.push(Math.floor(Math.random()*9)+1);
      let sum = numbers.reduce((a,b)=>a+b, 0);

      let idx = 0;
      setTimeout(() => {
        let interval = setInterval(() => {
          let box = document.getElementById('flash-box');
          if (idx < numbers.length) {
            if (box) {
              playSE('flash_tick');
              box.innerText = numbers[idx];
            }
            idx++;
          } else {
            clearInterval(interval);
            if (box) {
              box.innerHTML = `
                <div style="display:flex; flex-direction:column; align-items:center; gap:3px;">
                  <input type="number" id="flash-ans" class="flash-input" placeholder="合計" autofocus>
                  <button onclick="checkFlashAns(${sum})" style="padding:3px 8px; font-size:10px;">回答</button>
                </div>
              `;
            }
            window.currentFlashSuccess = onSuccess;
            window.currentFlashFailure = onFailure;
          }
        }, 500);
      }, 800);
    }

    function checkFlashAns(correctSum) {
      let inputEl = document.getElementById('flash-ans');
      let val = inputEl ? parseInt(inputEl.value) : NaN;
      if (val === correctSum) {
        openModal("⭕ 正解！", "", "");
        setTimeout(() => { closeModal(); window.currentFlashSuccess(); }, 800);
      } else {
        openModal("❌ 不正解！", `牌が5個飛びます`, "");
        removeRandomTiles(5, () => {
          if (window.currentFlashFailure) window.currentFlashFailure();
          else setTimeout(() => closeModal(), 800);
        });
      }
    }

    function openModal(title, desc, contentHtml) {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-desc').innerText = desc;
      document.getElementById('modal-content').innerHTML = contentHtml;
      document.getElementById('game-modal').style.display = 'flex';
    }

    function closeModal() {
      if (flashCountdownTimer) clearInterval(flashCountdownTimer);
      document.getElementById('game-modal').style.display = 'none';
    }

    function getTenpaiDiscards(hand13, currentDrawn) {
      const fullTiles = [...hand13];
      if (currentDrawn) fullTiles.push(currentDrawn);
      let valid = [];
      for (let i = 0; i < fullTiles.length; i++) {
        let temp13 = fullTiles.filter((_, idx) => idx !== i);
        if (checkTenpai(temp13).length > 0) valid.push(i);
      }
      return valid;
    }

    function checkTenpai(handTiles) {
      const all = [];
      ['m', 'p', 's'].forEach(s => { for(let n=1; n<=9; n++) all.push({type:s, val:n}); });
      for(let n=1; n<=7; n++) all.push({type:'z', val:n});
      let waits = [];
      for (let tile of all) {
        if (checkWin([...handTiles, tile])) waits.push(tile);
      }
      return waits;
    }

    function checkWin(tiles) {
      let counts = getTileCounts(tiles);
      if (kanCount === 0) {
        let pair = 0, chitoi = true;
        for (let k in counts) {
          if (counts[k] === 2) pair++;
          else if (counts[k] !== 0) chitoi = false;
        }
        if (chitoi && pair === 7) return true;
      }
      for (let k in counts) {
        if (counts[k] >= 2) {
          counts[k] -= 2;
          if (checkMentsu(counts)) return true;
          counts[k] += 2;
        }
      }
      return false;
    }

    function checkMentsu(counts) {
      let remKey = Object.keys(counts).find(k => counts[k] > 0);
      if (!remKey) return true;
      let [type, valStr] = remKey.split('_'), val = parseInt(valStr);
      if (counts[remKey] >= 3) {
        counts[remKey] -= 3;
        if (checkMentsu(counts)) return true;
        counts[remKey] += 3;
      }
      if (type !== 'z' && val <= 7) {
        let k2 = `${type}_${val+1}`, k3 = `${type}_${val+2}`;
        if (counts[k2] > 0 && counts[k3] > 0) {
          counts[remKey]--; counts[k2]--; counts[k3]--;
          if (checkMentsu(counts)) return true;
          counts[remKey]++; counts[k2]++; counts[k3]++;
        }
      }
      return false;
    }

    function getTileCounts(tiles) {
      let counts = {};
      tiles.forEach(t => {
        let key = `${t.type}_${t.val}`;
        counts[key] = (counts[key] || 0) + 1;
      });
      return counts;
    }

    function evaluateHand(tiles, isRiichiActive) {
      let counts = getTileCounts(tiles);
      let yakus = [{ name: '門前清自摸和', han: 1 }];
      if (isRiichiActive) yakus.push({ name: '立直', han: 1 });
      if (Object.keys(counts).every(k => !YAOCHU_KEYS.includes(k) || counts[k] === 0)) yakus.push({ name: '断幺九', han: 1 });

      let doraCount = 0, akaCount = 0;
      tiles.forEach(t => {
        actualDoraTiles.forEach(dt => { if (t.type === dt.type && t.val === dt.val) doraCount++; });
        if (t.isAka) akaCount++;
      });
      if (doraCount > 0) yakus.push({ name: `ドラ ${doraCount}`, han: doraCount });
      if (akaCount > 0) yakus.push({ name: `赤ドラ ${akaCount}`, han: akaCount });

      let totalHan = yakus.reduce((s, y) => s + y.han, 0);
      let { rawScore, scoreText } = calculateScore(totalHan, 30);
      return { yakus, rawScore, scoreText };
    }

    function calculateScore(han, fu) {
      let rawScore = 3000, text = `親 3000点 (${han}翻)`;
      if (han >= 5) { rawScore = 12000; text = `親満貫 12000点 (${han}翻)`; }
      return { rawScore, scoreText: text };
    }

    async function saveGlobalScore(playerName, turnNum, remHp, scoreVal, scoreText, yakuText) {
      if (!supabaseClient) return;
      let calcPoint = Math.round((scoreVal * remHp) / Math.max(1, turnNum));
      await supabaseClient.from('impossible_mahjong_scores').insert([{
        player_name: playerName, turn_count: turnNum, remaining_hp: remHp,
        score_val: scoreVal, score_text: scoreText, yaku_text: yakuText, calc_point: calcPoint
      }]);
      fetchGlobalRanking();
    }

    async function fetchGlobalRanking() {
      const listEl = document.getElementById('ranking-list');
      if (!supabaseClient) { listEl.innerHTML = '<li class="ranking-item">設定エラー</li>'; return; }
      const { data } = await supabaseClient.from('impossible_mahjong_scores').select('*').order('calc_point', { ascending: false }).limit(10);
      listEl.innerHTML = '';
      if (!data || data.length === 0) { listEl.innerHTML = '<li class="ranking-item">記録なし</li>'; return; }
      data.forEach((item, idx) => {
        const li = document.createElement('li');
        li.className = 'ranking-item';
        li.innerHTML = `
          <div class="rank-head"><span>#${idx+1} HP:${item.remaining_hp}</span><span>${item.turn_count}打</span></div>
          <div class="rank-player">${escapeHTML(item.player_name)}</div>
          <div class="rank-detail">${item.score_text}</div>
        `;
        listEl.appendChild(li);
      });
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }

    function render(newAddedIds = [], destroyIds = []) {
      document.getElementById('deck-count').innerText = deck.length;
      document.getElementById('turn-count').innerText = turn;

      const doraEl = document.getElementById('dora-tile-container');
      doraEl.innerHTML = '';
      doraIndicators.forEach(dInd => doraEl.appendChild(createTileElement(dInd, null, true)));

      const fullTiles = [...hand];
      if (drawnTile) fullTiles.push(drawnTile);
      let expectedCount = 14 - (kanCount * 3);

      const waitsContainer = document.getElementById('waits-container');
      waitsContainer.innerHTML = '';
      if (!isGameOver) {
        let currentHandTiles = fullTiles.length === expectedCount ? hand : fullTiles;
        let waits = checkTenpai(currentHandTiles);
        if (waits.length > 0) {
          waits.forEach(wTile => waitsContainer.appendChild(createTileElement(wTile, null, true)));
        } else {
          waitsContainer.innerText = 'ノーテン';
        }
      }

      const btnSacrifice = document.getElementById('btn-sacrifice');
      let availableMentsu = findAvailableMentsu(fullTiles);
      if (!isGameOver && availableMentsu.length > 0) {
        btnSacrifice.style.display = 'inline-block';
        let coolDown = 5 - (turn - lastSacrificeTurn);
        if (coolDown <= 0) { btnSacrifice.disabled = false; btnSacrifice.innerText = '面子回復'; }
        else { btnSacrifice.disabled = true; btnSacrifice.innerText = `回復(${coolDown})`; }
      } else { btnSacrifice.style.display = 'none'; }

      const btnKyushu = document.getElementById('btn-kyushu');
      btnKyushu.style.display = (!isGameOver && countYaochuTypes(fullTiles) >= 9) ? 'inline-block' : 'none';

      const btnKan = document.getElementById('btn-kan');
      let tileCounts = getTileCounts(fullTiles);
      let canKan = (fullTiles.length === expectedCount) && Object.values(tileCounts).some(cnt => cnt === 4);
      btnKan.style.display = (canKan && !isGameOver) ? 'inline-block' : 'none';

      const btnWin = document.getElementById('btn-win');
      if (fullTiles.length === expectedCount && checkWin(fullTiles) && !isGameOver) btnWin.classList.add('btn-win-glow');
      else btnWin.classList.remove('btn-win-glow');

      let riichiIndices = (!isRiichi && !isGameOver && fullTiles.length === expectedCount) ? getTenpaiDiscards(hand, drawnTile) : [];
      const btnRiichi = document.getElementById('btn-riichi');
      if (!isRiichi && riichiIndices.length > 0 && !isRiichiSelecting) btnRiichi.disabled = false;
      else if (!isRiichiSelecting) btnRiichi.disabled = true;

      const handEl = document.getElementById('hand');
      handEl.innerHTML = '';
      hand.forEach((tile, idx) => {
        let isTarget = isRiichiSelecting && riichiIndices.includes(idx);
        handEl.appendChild(createTileElement(tile, () => handleTileClick(idx, false), false, isTarget, newAddedIds.includes(tile.id), destroyIds.includes(tile.id)));
      });

      const drawnEl = document.getElementById('drawn-tile');
      drawnEl.innerHTML = '';
      if (drawnTile) {
        let isTarget = isRiichiSelecting && riichiIndices.includes(hand.length);
        drawnEl.appendChild(createTileElement(drawnTile, () => handleTileClick(null, true), false, isTarget, newAddedIds.includes(drawnTile.id), destroyIds.includes(drawnTile.id)));
      }

      const riverEl = document.getElementById('river');
      riverEl.innerHTML = '';
      river.forEach(tile => riverEl.appendChild(createTileElement(tile, null, true)));
    }

    function handleTileClick(index, isDrawn) {
      if (isGameOver) return;
      if (isRiichi && !isDrawn) { playSE('error'); return; }
      discard(index, isDrawn);
    }

    function createTileElement(tile, onClick, isSmall = false, isRiichiTarget = false, isNew = false, isDestroy = false) {
      const el = document.createElement('div');
      el.className = 'tile';
      el.dataset.id = tile.id || 0;
      if (isSmall) el.classList.add('small');
      if (isRiichiTarget) el.classList.add('riichi-target');
      if (tile.isAka) el.classList.add('aka-dora');
      if (isDestroy) el.classList.add('destroying');
      if (isNew) { el.classList.add('slide-in'); el.classList.add('new-drawn'); }

      let colorClass = 'black', displayText = '', typeText = '';
      if (tile.type === 'z') {
        displayText = HONORS[tile.val - 1];
        if (tile.val === 6) colorClass = 'green';
        else if (tile.val === 7) colorClass = 'red';
      } else {
        displayText = tile.val;
        typeText = SUITS[tile.type];
        if (tile.type === 'm') colorClass = 'red';
        if (tile.type === 's') colorClass = 'green';
      }
      el.classList.add(colorClass);
      el.innerHTML = `<span class="tile-num">${displayText}</span>${typeText ? `<span class="tile-type">${typeText}</span>` : ''}`;
      if (onClick) el.addEventListener('click', onClick);
      return el;
    }

    function showMessage(title, yaku, score) {
      document.getElementById('msg-title').innerText = title;
      document.getElementById('msg-yaku').innerText = yaku;
      document.getElementById('msg-score').innerText = score;
    }

    function clearMessages() { showMessage('', '', ''); document.getElementById('msg-error').innerText = ''; }

    initGame();
  </script>
